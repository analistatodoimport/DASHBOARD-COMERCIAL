<script>

const tb=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
$('#tm').innerHTML=tb(['Marca','Venta total','Participación','Activación','Productos activos','Producto líder','Estado'],allB.map(m=>{const rr=cur.filter(r=>r.m==m),v=sum(rr,'a'),ac=new Set(rr.filter(r=>r.a>0).map(r=>r.c)).size/ncl*100,pp=G(rr,'p'),s=ac>=60?'g':ac>=30?'y':'r';return[m,v,v/(tot||1)*100,ac,pp.filter(x=>x[1]>0).length,pp[0]&&pp[0][1]>0?E(pp[0][0]):'—',s,v]}).sort((x,y)=>y[7]-x[7]).map(x=>[E(x[0]),$$(x[1]),P(x[2]),P(x[3]),x[4],x[5],`<b class="p${x[6]}">● ${{g:'Bien',y:'Atención',r:'Crítico'}[x[6]]}</b>`]));
const pt=l=>tb(['Producto','Marca','Unidades','Monto'],l.map(x=>[E(x[0]),E((D.find(r=>r.p==x[0])||{}).m||''),N(x[1]),$$(pa[x[0]]||0)]));
$('#tt').innerHTML=pt(t10);$('#tb').innerHTML=pt(b10);
$('#td').innerHTML=tb(['Fecha','Vendedor','Zona','Cliente','Marca','Producto','Unid.','Monto','Gestión','Resultado','Observaciones'],[...cur].sort((x,y)=>y.f-x.f).slice(0,150).map(r=>[r.f.toLocaleDateString('es-VE'),r.v,r.z,r.c,r.m,r.p,N(r.u),$$(r.a),r.g,r.r,r.o].map(E)))+(cur.length>150?`<p>Mostrando 150 de ${cur.length} registros. Afina los filtros para ver el resto.</p>`:'')}
function ch(id,type,data,h){const lab=data.map(x=>x[0]),val=data.map(x=>Math.round(x[1]*10)/10),pal=[col('p'),col('s'),'#f59e0b','#ec4899','#10b981','#8b5cf6','#ef4444','#14b8a6','#f97316','#64748b'];CH[id]&&CH[id].destroy();
CH[id]=new Chart($('#'+id),{type,data:{labels:lab,datasets:[{data:val,backgroundColor:type=='line'?col('p')+'33':lab.map((_,i)=>pal[i%pal.length]),borderColor:col('p'),fill:type=='line',tension:.3,borderWidth:type=='line'?3:0,borderRadius:6}]},options:{indexAxis:h?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type=='doughnut',position:'bottom'}}}})}

/* ---- apariencia ---- */
function applyCfg(){const r=document.documentElement.style;for(const k in L)r.setProperty('--'+k,col(k));
r.setProperty('--f',`'${cfg.font}',sans-serif`);r.setProperty('--fs',cfg.fs+'px');r.setProperty('--ks',cfg.ks+'px');r.setProperty('--rad',cfg.style=='flat'?'4px':'20px');r.setProperty('--sh',cfg.style=='round'?'0 6px 24px rgba(0,0,0,.09)':'none');
document.documentElement.dataset.style=cfg.style;Chart.defaults.color=col('tx');Chart.defaults.font.family=`'${cfg.font}',sans-serif`;
SECS.forEach(([id])=>{const e=$('#s-'+id);e.style.order=cfg.order.indexOf(id);e.hidden=cfg.hide.includes(id)});
const lg=cfg.logo?`<img src="${cfg.logo}" alt="">`:'';$('#lg').innerHTML=lg+`<h1>${E(cfg.name)}</h1>`;$('#hl').innerHTML=lg;$('#hn').textContent=cfg.name;
$('#nav').innerHTML=cfg.order.filter(i=>!cfg.hide.includes(i)).map(i=>`<a href="#s-${i}">${SECS.find(s=>s[0]==i)[1]}</a>`).join('')}
function panel(){const o=cfg.order;$('#adm').innerHTML=`<div class="sr"><h3 style="flex:1">Personalización</h3><button class="b o" id="ax">✕</button></div>
<label>URL del CSV (acepta el enlace “publicar en la web”)<input id="a-url" value="${E(cfg.url)}"></label><button class="b" id="a-sv">Guardar y actualizar datos</button>
<label>Nombre de la empresa<input id="a-name" value="${E(cfg.name)}"></label><label>Meta mensual (Bs.)<input id="a-meta" type="number" value="${cfg.meta}"></label>
${Object.keys(CN).map(k=>`<label>${CN[k]}<input type="color" data-c="${k}" value="${col(k)}"></label>`).join('')}
<label>Tipografía<select id="a-font">${['Inter','Poppins','Plus Jakarta Sans'].map(f=>`<option ${f==cfg.font?'selected':''}>${f}</option>`).join('')}</select></label>
<label>Tamaño base del texto<input id="a-fs" type="range" min="13" max="20" value="${cfg.fs}"></label><label>Tamaño de KPIs<input id="a-ks" type="range" min="22" max="52" value="${cfg.ks}"></label>
<label>Estilo de tarjetas<select id="a-style">${[['round','Redondeadas con sombra'],['flat','Planas'],['outline','Con borde']].map(x=>`<option value="${x[0]}" ${x[0]==cfg.style?'selected':''}>${x[1]}</option>`).join('')}</select></label>
<label>Modo<select id="a-theme"><option value="light" ${cfg.theme=='light'?'selected':''}>Claro</option><option value="dark" ${cfg.theme=='dark'?'selected':''}>Oscuro</option></select></label>
<label>Logo (PNG o JPG)<input type="file" id="a-logo" accept="image/png,image/jpeg"></label><button class="b o" id="a-nl">Quitar logo</button>
<h4>Secciones: orden y visibilidad</h4>${o.map((id,i)=>`<div class="sr"><input type="checkbox" style="width:24px;min-height:0" data-h="${id}" ${cfg.hide.includes(id)?'':'checked'}><span>${SECS.find(s=>s[0]==id)[1]}</span><button class="b o" data-mv="${id}:-1">↑</button><button class="b o" data-mv="${id}:1">↓</button></div>`).join('')}
<button class="b o" id="a-rs">Restaurar apariencia</button>`}
const upd=()=>{save();applyCfg();render()};
$('#adm').oninput=e=>{const t=e.target,i=t.id;if(t.dataset.c)cfg.c[t.dataset.c]=t.value;else if(i=='a-name')cfg.name=t.value;else if(i=='a-meta')cfg.meta=+t.value||0;else if(i=='a-font')cfg.font=t.value;else if(i=='a-fs')cfg.fs=+t.value;else if(i=='a-ks')cfg.ks=+t.value;else if(i=='a-style')cfg.style=t.value;else if(i=='a-theme'){cfg.theme=t.value;cfg.c={}}else if(t.dataset.h){cfg.hide=cfg.hide.filter(x=>x!=t.dataset.h);if(!t.checked)cfg.hide.push(t.dataset.h)}else return;upd();if(i=='a-theme')panel()};
$('#adm').onchange=e=>{const t=e.target;if(t.id!='a-logo'||!t.files[0])return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/im.width,120/im.height),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cfg.logo=c.toDataURL('image/png');upd()};im.src=fr.result};fr.readAsDataURL(t.files[0])};
$('#adm').onclick=async e=>{const t=e.target,i=t.id;if(i=='ax')$('#adm').hidden=true;else if(i=='a-sv'){cfg.url=$('#a-url').value.trim()||DEF;save();t.textContent='Actualizando…';await refresh();t.textContent=isDemo?'No se pudo leer el CSV':'Datos actualizados'}
else if(i=='a-nl'){cfg.logo='';upd()}else if(i=='a-rs'){Object.assign(cfg,{c:{},theme:'light',font:'Inter',fs:16,ks:34,style:'round',order:SECS.map(s=>s[0]),hide:[]});upd();panel()}
else if(t.dataset.mv){const[id,d]=t.dataset.mv.split(':'),o=cfg.order,k=o.indexOf(id),n=k+ +d;if(n>=0&&n<o.length){[o[k],o[n]]=[o[n],o[k]];upd();panel()}}};

/* ---- filtros / acceso ---- */
function fill(id,list,ph){const s=$(id),v=s.value;s.innerHTML=`<option value="">${ph}</option>`+list.map(x=>`<option>${E(x)}</option>`).join('');s.value=list.includes(v)?v:''}
function fills(){fill('#fm',uniq('m'),'Todas las marcas');fill('#fp',uniq('p'),'Todos los productos');fill('#fv',uniq('v'),'Todos los vendedores');fill('#fz',uniq('z'),'Todas las zonas')}
async function refresh(){await load();fills();render()}
const FM={fr:'r',fa:'a',fb:'b',fm:'m',fp:'p',fv:'v',fz:'z'};
Object.keys(FM).forEach(id=>$('#'+id).onchange=e=>{F[FM[id]]=e.target.value;$('#fc').hidden=$('#fd').hidden=F.r!='custom';render()});
$('#frs').onclick=()=>{F={r:'mes',a:'',b:'',m:'',p:'',v:'',z:''};Object.keys(FM).forEach(id=>$('#'+id).value=FM[id]=='r'?'mes':'');$('#fc').hidden=$('#fd').hidden=true;render()};
$('#fup').onclick=async e=>{e.target.textContent='Actualizando…';await refresh();e.target.textContent='Actualizar datos'};
function show(){$('#login').hidden=!!role;$('#app').hidden=!role;if(!role){$('#pv').hidden=$('#pw').hidden=true;return}
$('#hr').textContent=role=='vendedor'?vend:role=='admin'?'Administrador':'Gerencia';$('#bcv').hidden=role!='vendedor';$('#bad').hidden=role!='admin';$('#fvw').hidden=role=='vendedor';$('#adm').hidden=true;applyCfg();render()}
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r;$('#pv').hidden=r!='vendedor';$('#pw').hidden=r=='vendedor';$('#pe').textContent='';$('#pw').dataset.r=r;if(r=='vendedor')$('#vs').innerHTML=uniq('v').map(v=>`<option>${E(v)}</option>`).join('')});
$('#vok').onclick=()=>{role='vendedor';vend=$('#vs').value;LS.s('role',role);LS.s('vend',vend);show()};
const tryPw=()=>{if($('#pwi').value=='2026'){role=$('#pw').dataset.r;vend='';LS.s('role',role);LS.s('vend','');$('#pwi').value='';show()}else $('#pe').textContent='Clave incorrecta'};
$('#pok').onclick=tryPw;$('#pwi').onkeydown=e=>e.key=='Enter'&&tryPw();
const out=()=>{role=null;vend='';LS.s('role',null);LS.s('vend','');show()};$('#bout').onclick=out;$('#bcv').onclick=out;
$('#bad').onclick=()=>{panel();$('#adm').hidden=false};
$('#bth').onclick=()=>{cfg.theme=cfg.theme=='dark'?'light':'dark';cfg.c={};upd()};
(async()=>{applyCfg();await load();fills();if(role=='vendedor'&&!D.some(r=>r.v==vend))role=null;show()})();
</script></body></html>
